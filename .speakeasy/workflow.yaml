workflowVersion: 1.0.0
speakeasyVersion: latest
sources:
    dev:
        inputs:
            - location: registry.speakeasyapi.dev/moov/moov/api-dev
        registry:
            location: registry.speakeasyapi.dev/moov/moov/python-dev
targets:
    latest:
        target: csharp
        source: dev
        publish:
            nuget:
                apiKey: $nuget_api_key
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/moov/moov/dev-csharp-code-samples
            labelOverride:
                fixedValue: Csharp (SDK)
            blocking: false
