workflowVersion: 1.0.0
speakeasyVersion: latest
sources:
    latest:
        inputs:
            - location: registry.speakeasyapi.dev/moov/moov/api-latest
        registry:
            location: registry.speakeasyapi.dev/moov/moov/latest
targets:
    latest:
        target: csharp
        source: latest
        publish:
            nuget:
                apiKey: $nuget_api_key
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/moov/moov/latest-csharp-code-samples
            labelOverride:
                fixedValue: Csharp (SDK)
            blocking: false
