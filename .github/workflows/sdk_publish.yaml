name: Publish
permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
"on":
  push:
    branches:
      - main
    paths:
      - .speakeasy/gen.lock
  workflow_dispatch: {}
jobs:
  publish:
    uses: speakeasy-api/sdk-generation-action/.github/workflows/sdk-publish.yaml@v15
    with:
      target: latest
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      nuget_username: ${{ secrets.NUGET_USERNAME }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
  publish-nuget:
    needs:
      - publish
    if: ${{ needs.publish.outputs.csharp_regenerated == 'true' && needs.publish.outputs.publish_csharp == 'true' && needs.publish.outputs.use_nuget_trusted_publishing == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: speakeasy-api/sdk-generation-action/publish-nuget@v15
        with:
          csharp-directory: ${{ needs.publish.outputs.csharp_directory }}
          dotnet-version: 8.x
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nuget-username: ${{ secrets.NUGET_USERNAME }}
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
